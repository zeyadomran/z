[workspace]
members = ["crates/harness-core", "crates/harness-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.23"

[workspace.lints.rust]
unsafe_code = "forbid"
