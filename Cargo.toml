[workspace]
members = ["crates/harness-core", "crates/harness-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
thiserror = "2.0"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.23"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream"] }
sha2 = "0.11.1"
httpdate = "1.0.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[workspace.lints.rust]
unsafe_code = "deny"
